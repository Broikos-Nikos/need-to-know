# The negative controls behind the gates (MA-F16): each breaks what its gate guards and names the test that must
# fail. bench/controls.py applies each change in order, runs the test, restores every file byte for byte and says
# how many failed as they must; tests/test_bench.py holds each change to text its file holds once.

