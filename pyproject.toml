[project]
name = "need-to-know"
version = "0.1.0"
description = "A vector database RAG project where every section of a document names who may read it"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nikos Broikos", email = "broikos.nikolaos@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # The local server, ntk serve (T6.1), with uvicorn below.
    "fastapi>=0.146.0,<0.147",
    # Only the tests' local mode uses it for now; the index writes and searches through
    # it from T3.3 on, so it stays a runtime dependency rather than moving twice (SC-F2).
    "qdrant-client>=1.19.1,<1.20",
    "snowballstemmer>=3.1.1,<3.2",
    "uvicorn>=0.54.0,<0.55",
]

[project.optional-dependencies]
# The embedding model, needed to build the index and to search it, not to run the
# tests or the page: `uv sync --extra embed`. On Windows torch comes from the
# CUDA 13.0 index below.
embed = [
    "torch>=2.14.1,<2.15",
    "transformers>=5.19,<5.20",
]

[project.scripts]
ntk = "needtoknow.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "needtoknow"

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "brotli>=1.2.0",
    "fonttools>=4.67.0",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
