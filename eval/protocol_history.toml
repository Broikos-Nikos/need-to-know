# Every version of eval/protocol.toml, oldest first. tests/test_protocol.py fails
# until the newest entry carries the protocol's current sha256, taken over its
# bytes with LF line ends, so every change to the protocol is dated and explained
# here and none is made after the fact without a trace.

[[version]]
date = 2026-10-12
sha256 = "d300e13df357b49921862d68dbee3df3117463e7e97c01ecf173b5a416835646"
reason = "Registered before any question, probe, answer or score existed."

[[version]]
date = 2026-10-12
sha256 = "9ebe6bdb89d2616bd8fcf42f2d6037a01ce42c4a71fbef23292d8fbd8fca3bda"
reason = """\
Still before any question, probe, answer or score existed. Version 1 redrew the \
split when the baseline's dev and test scores disagreed, which let a test outcome \
choose, and would have moved families whose dev answers had already been read into \
the new test split. Now the baseline only reports that difference, the split's \
balance is checked at construction on properties that carry no outcome, and no \
family changes split after the first scored run. A test set voided twice is \
replaced from test families no published item has used."""

[[version]]
date = 2026-10-13
sha256 = "162ca513150de1ec171a2858701ab76250e18ba644e6a7bd9b2297d59ce190be"
reason = """\
Still before any question, probe, answer or score existed. The registry came to \
103 fact families, not 600, so 50 test and 200 dev items would have asked several \
items of one family as if they were independent. The family becomes the unit of \
the split and of every test: 40 test families with one item each, the other 63 \
with two or three dev items each, differing in condition rather than wording; a \
sign flip permutation test and a bootstrap over family means replace McNemar and \
Tango; the smallest visible effect is stated. Registered with them: the overlap \
cap on the planted sentence's three rarest terms in the lexical analyser's terms, \
twenty paraphrase twins, rewrites logged with their side, repeats asked with the \
answer cache off and averaged per item, and an experiment with several values \
adopting the cheapest that clears an arm."""

[[version]]
date = 2026-10-13
sha256 = "b85036265b19479695201cdbea538de4c47e95c3b73efee5ba29bd6602c3dd8c"
reason = """\
Still before any question, probe, answer or score existed. Version 3 split the \
registry's 103 families, but the registry gives each product sibling a family of \
its own and plants siblings, and some facts of other topics, in one section: 81 \
groups join every fact that shares a section, and a dev item's excerpt would show \
a test fact's sentence wherever a group straddled the splits, about seven groups \
at the registered share. The family is now the group (N56), and the same share, \
0.388, draws 31 test families of 81, one item each; the other 50 carry the dev \
items."""

[[version]]
date = 2026-10-13
sha256 = "b4ad8e5b7e4459905119231f1e30f9726269bfdc328720b59b712b9c1297c6d5"
reason = """\
Still before any question, probe, answer or score existed. Version 4 fixed the 31 \
test families and left every category count to the writing, where a count can be \
chosen once items exist (RS-F17). The categories and their counts are now fixed \
(N57): the test's 35 items, family items using every test family once and table, \
