# The evaluation protocol, registered on 2026-10-12, before any question, probe,
# answer or score existed. It fixes what may decide and what may only report:
# development and every optimisation experiment see the dev split alone, and the
# test split runs once per release and is published whatever it shows.
#
# Code reads this file through needtoknow.eval.protocol, which refuses any use of a
# split that is not registered here. tests/test_protocol.py holds the file to the
# newest hash in eval/protocol_history.toml, so a change is a new dated entry there
# with its reason, never a quiet edit.

version = 5
registered = 2026-10-12

[splits]
# The unit of the split, and of every test, is the fact family: a planted fact with
# its versions and its regional or product variants, and every fact planted in a
# section beside one of them, transitively, since an excerpt about one shows the
# others' sentences (N56). The plan's 103 registry families make 81 such families.
# Items about one family cluster, so counting them as independent would overstate
# every interval. Every golden item and probe takes the split of the family it asks
# about, so no fact is asked in both and no excerpt of a dev item holds a test fact.
# The 31 test families, a share of 0.388 as N43 chose, are drawn directly, at random
# within each stratum, never by any score. Items that ask about no registry fact, a
# table row or a fact the corpus does not hold, are their own units and are written
# for one split only.
unit = "fact family"
family = "a registry family and every fact planted in a section beside it, transitively"
seed = 20261012
test_families = 31
stratify_by = ["label", "kind"]

[splits.balance]
# Checked twice, both times before any item is scored, on properties that carry no
# outcome: when the families are split, before any item is written, and again when
# the items are written. Each property's standardized mean difference between the
# halves stays under the limit. A family split that fails is replaced by the next
# seed's before any item exists, and every draw is recorded; an item that unbalances
# its split is rewritten, never moved. At about half of fair writing rounds the bar
# fails by chance, so it stays at 0.1 and every rewrite is logged with the property
# and the side it moved. After the first scored run, no family ever changes split.
when = "construction"
family_properties = ["placements", "document_size", "language", "salience"]
item_properties = ["stemmed_overlap", "category", "language"]
max_standardized_mean_difference = 0.1
rewrites = "logged, with the property and the side"

[splits.test]
# The published accuracy: one item for each test family, by construction, with its
# Wilson interval over families. The baseline is the first release.
items_per_family = 1
probes = "two per fact of the split's families"
purposes = ["baseline", "release"]

[splits.dev]
# Where the power is: two or three items for each of the 50 dev families, differing
# in their condition, English, Greek, cross lingual, mixed file or no access, rather
# than in their wording.
items_per_family = [2, 3]
probes = "two per fact of the split's families"
purposes = ["development", "baseline", "experiment", "parity"]

[items]
# Each item is drafted from the registry, then rewritten without the planted
# sentence in view. Its overlap with the planted sentence is counted in the terms
# the lexical search uses, so Greek stems count as BM25 sees them, on the planted
# sentence's three rarest terms by the corpus's document frequency: at most one of
# them may be in the question. About 20 dev items get a paraphrase twin, and the
# gap between twins is reported.
overlap_terms = "needtoknow.lexical.terms"
rare_terms = 3
max_shared_rare_terms = 1
paraphrase_twins = 20
# A fact whose value a model may know without the documents is asked only by an E
# item, whose right answer is a refusal whatever the model knows (RS-F19).
defaults = "asked only by E items"

[items.test]
# The categories (N57). Family items use every test family once: F and M each use two.
#   A  the asker's own label, in English       B  the asker's own label, in Greek
#   C  cross lingual                           D  a mixed file, the asker's section
#   E  no access: the answer is where the asker may not read
#   F  the administrator across two labels     M  multi hop across two documents
#   G  a superseded value against the current  H  the right regional variant
# Own units, written for this split only: I a table row; J a fact the corpus does not
# hold; N a near miss, absent but with a neighbour that is present, scored like J.
# No category holds an answer spanning a unit boundary: every planted fact is one self
# contained sentence in one unit, and no item can honestly need two.
A = 6
B = 5
C = 3
D = 4
E = 4
F = 1
M = 1
G = 4
H = 1
I = 2
J = 2
N = 2

[items.dev]
# Two or three items for each dev family, in the test's category shares, each within
# the tolerance; the own units counted here; Greek between the bounds in each split.
I = 8
J = 8
N = 8
share_tolerance = 0.05
greek_share = [0.45, 0.55]

[baseline]
# deepseek-flash on both splits, three repeats, every scored answer asked with the
# answer cache off, since a repeat sends the same prompt and would come back from
# it. An item's score is its mean over the repeats, and an item whose verdict
# changes between repeats is marked unstable. The dev and test difference is
# published with its interval as a diagnostic and changes nothing: the baseline is
# the first release, and by then the dev items have been read during development.
repeats = 3
cache = "off"
aggregate = "per item mean over repeats"
on_disagreement = "report"

[decision]
# One variable per experiment, against the incumbent, paired by item on dev and
# tested over families. Never adopted with a leak in the permission suite, the
# canaries or any dev answer. Otherwise adopted by exactly one of these arms:
#   up     the family mean difference above zero by the test under alpha
#   cost   USD per question or p95 seconds down by cost_cut or more, and the lower
#          end of the interval for the family mean difference above minus the margin
#   probe  dev probe recall@10 up by the test under alpha, and accuracy non
#          inferior as for cost
# An experiment with several values compares each with the incumbent; among the
# values that clear an arm, the cheapest is adopted. The smallest effect these
# families can show is stated beside every decision.
unit = "fact family"
test = "sign flip permutation test over family mean differences, two sided"
interval = "percentile bootstrap over families, 10000 resamples, 95 percent"
alpha = 0.05
non_inferiority_margin = 0.05
smallest_visible_effect = 0.10
cost_cut = 0.20
arms = ["up", "cost", "probe"]
several_values = "each against the incumbent; the cheapest that clears an arm"

[reporting]
# Variant families are few, so their items are reported family by family and decide
# nothing alone.
variant_items = "descriptive, by family"
# The headline is the share of all test items answered right; beside it, the share of
# the family items alone, since J and N items, refused by a model that invents nothing,
# are the easiest (RS-F17). The closed book run's hits on deliberate defaults are
# reported apart from its other hits (RS-F19, KB1-F7).
headline = "all test items, and beside it the family items alone"
defaults = "the closed book run's hits on deliberate defaults reported apart"

[release]
# Before each test run, a parity check on the exact build that will run it: the
# retrieved unit ids and scores for every dev item equal those of the last dev run
# of the same configuration hash. The test result never chooses, reverts or tunes
# anything. A defect found after a test run, and visible without looking at any
# outcome, allows one rerun per test set, with both runs published and the defect
# named; a second such defect costs a new test set, written from test families that
# no published test item has used, or a release without a test number, saying why.
parity = "retrieval for every dev item equals the last dev run of the same configuration"
reruns_per_test_set = 1
published = "the latest release, with every release listed"

[experiments]
# The order is fixed here. Each experiment changes one variable.
order = [
  "E1 rerank: none, BGE-M3 multi vector, bge-reranker-v2-m3",
  "E2 fusion: dense only, BM25 only, RRF",
  "E3 excerpts: 4, 8 or 12; one paragraph or with two neighbours",
  "E4 thinking: enabled or disabled",
  "E5 heading prefix: full path, title only, none, a shuffled placebo",
  "E6 units: paragraph, or sentence returning its paragraph",
  "E7 prompt rules for versions, regional variants and refusals",
  "E8 query rewriting, after the hybrid baseline is measured",
  "E9 temperature 0 or 0.3, and max tokens",
  "E10 deepseek-v4-pro, only when the owner opens the model comparison",
]
