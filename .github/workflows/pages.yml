# Test, build, gate and publish the page.
#
# The page is the published face of a retrieval system that runs on a GPU, and
# the runner has none, so nothing here builds an index or asks a model. What it
# can hold, it holds:
#
# `test` runs the suite as the README runs it, `uv sync` and `uv run pytest`,
# which needs no GPU, key or network after the sync: the permission gate on a
# small profile in Qdrant's local mode, the noninterference test, the claims and
# every other test; those that need the GPU, the Qdrant binary or a built index
# skip, and `-rs` lists each with what it needed.
#
# `build` runs the project's own gates before vite writes anything: the type
# check, every number in the README held to the recorded output of its command,
# and the page's recorded data held to the records it is read from.
#
# `verify` drives the built page in a real browser, where no server of its own
# answers, as the published page is met: what it replays against the recording,
# the stand in for the local server, and the page without JavaScript.
#
# Nothing deploys unless all three pass: the deploy job needs them, and the jobs
# that run other people's code, `npm ci`'s install hooks and the browser's
# install as root, hold no credential that could deploy.

name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv at the version the lockfile was written with, from PyPI, into the runner's own Python as the workspace
      # pins a tool it installs.
      - run: python -m pip install --disable-pip-version-check "uv==0.12.0"
      - run: uv sync --frozen
      # The README's own order, the commands it gives a reader run where a reader would: the corpus built from the
      # plan and the narrative, and every planted fact checked where the plan put it, before the suite.
      - run: uv run --frozen ntk corpus plan
      - run: uv run --frozen ntk corpus assemble
      - run: uv run --frozen ntk corpus check
      - run: uv run --frozen pytest -q -rs

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: python -m pip install --disable-pip-version-check "uv==0.12.0"
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: web/dist
          retention-days: 1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: web/dist
      - run: npx playwright install --with-deps chromium
      - run: npm run verify

  deploy:
    # Only after all three, and the only job holding the permissions that can publish anything.
    needs: [test, build, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
